---
- name: Compile the global sieve scripts
  ansible.builtin.command:
    cmd: sievec -c {{ mail_dovecot_conf }} {{ mail_sieve_dir }}/{{ item }}.sieve
  loop: "{{ mail_sieve_scripts }}"
  changed_when: true

- name: Restart dovecot
  ansible.builtin.systemd_service:
    name: dovecot
    state: restarted
