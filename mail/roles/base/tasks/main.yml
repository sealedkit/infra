---
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ mail_hostname }}"

- name: Preseed the Postfix debconf answers
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop:
    - question: postfix/main_mailer_type
      vtype: select
      value: No configuration
    - question: postfix/mailname
      vtype: string
      value: "{{ mail_hostname }}"

- name: Install the mail stack
  ansible.builtin.apt:
    name:
      - postfix
      - postfix-lmdb
      - dovecot-core
      - dovecot-imapd
      - dovecot-lmtpd
      - dovecot-sieve
      - dovecot-managesieved
      - redis-server
      - unbound
      - ca-certificates
      - bind9-dnsutils
    state: present
    update_cache: true

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: mail_rspamd_upstream_suite | length > 0

- name: Add the rspamd signing key
  ansible.builtin.get_url:
    url: https://rspamd.com/apt-stable/gpg.key
    dest: /etc/apt/keyrings/rspamd.asc
    mode: "0644"
  when: mail_rspamd_upstream_suite | length > 0

- name: Add the rspamd repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: http://rspamd.com/apt-stable/
      Suites: {{ mail_rspamd_upstream_suite }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/rspamd.asc
    dest: /etc/apt/sources.list.d/rspamd.sources
    mode: "0644"
  when: mail_rspamd_upstream_suite | length > 0

- name: Install rspamd
  ansible.builtin.apt:
    name: rspamd
    state: present
    update_cache: true

- name: Create the vmail group
  ansible.builtin.group:
    name: vmail
    gid: "{{ mail_vmail_uid }}"
    system: true

- name: Create the vmail user
  ansible.builtin.user:
    name: vmail
    uid: "{{ mail_vmail_uid }}"
    group: vmail
    home: "{{ mail_vmail_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Secure the mail store
  ansible.builtin.file:
    path: "{{ mail_vmail_home }}"
    state: directory
    owner: vmail
    group: vmail
    mode: "0750"

- name: Configure unbound
  ansible.builtin.copy:
    src: unbound-mail.conf
    dest: /etc/unbound/unbound.conf.d/mail.conf
    mode: "0644"
  notify: Restart unbound

- name: Flush handlers so unbound is live before the switchover
  ansible.builtin.meta: flush_handlers

- name: Enable unbound
  ansible.builtin.systemd_service:
    name: unbound
    state: started
    enabled: true

- name: Verify unbound validates DNSSEC
  ansible.builtin.command:
    cmd: dig @127.0.0.1 +dnssec +noall +comment {{ mail_hostname }} A
  register: base_unbound_check
  changed_when: false
  failed_when: base_unbound_check.stdout is not search('flags:[^;]*\\bad\\b')

- name: Check whether systemd-resolved is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/systemd-resolved.service
  register: base_resolved_unit

- name: Stop systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  when: base_resolved_unit.stat.exists

- name: Check whether resolv.conf is still a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: base_resolv_conf

- name: Drop the systemd-resolved resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: base_resolv_conf.stat.islnk | default(false)

- name: Point the resolver at unbound
  ansible.builtin.copy:
    content: |
      nameserver 127.0.0.1
      options edns0 trust-ad
    dest: /etc/resolv.conf
    mode: "0644"

- name: Enable redis
  ansible.builtin.systemd_service:
    name: redis-server
    state: started
    enabled: true

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  when: mail_manage_firewall

- name: Allow the mail and management ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ mail_firewall_ports }}"
  when: mail_manage_firewall

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: mail_manage_firewall
