---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow the configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
