---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow the configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ firewall_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
