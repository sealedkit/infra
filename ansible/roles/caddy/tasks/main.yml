---
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"

- name: Add the Caddy repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
      Suites: any-version
      Components: main
      Signed-By: /etc/apt/keyrings/caddy-stable.asc
    dest: /etc/apt/sources.list.d/caddy-stable.sources
    mode: "0644"

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy=2.11.4
    state: present
    update_cache: true

- name: Give quic-go the socket buffers it asks for
  ansible.builtin.copy:
    content: |
      net.core.rmem_max = 7500000
      net.core.wmem_max = 7500000
    dest: /etc/sysctl.d/30-caddy-quic.conf
    mode: "0644"
  notify: Apply the socket buffers

- name: Write the Caddyfile
  ansible.builtin.template:
    src: "{{ caddy_caddyfile }}"
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s

- name: Enable caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

- name: Load the Caddyfile into the running server
  ansible.builtin.command: caddy reload --config /etc/caddy/Caddyfile
  changed_when: false
