name: DNS

on:
  pull_request:
    paths:
      - dns/**
      - mail/group_vars/mail/main.yml
      - mail/roles/caddy/templates/mta-sts.txt.j2
      - .github/workflows/dns.yml
  push:
    branches:
      - main
    paths:
      - dns/**
      - .github/workflows/dns.yml
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

concurrency:
  group: dns
  cancel-in-progress: false

defaults:
  run:
    working-directory: dns

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run octodns-validate --config-file config.yaml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN_RO }}
      - run: uv run check_mta_sts.py rendered
      - run: uv run octodns-sync --config-file config.yaml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN_RO }}

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run check_mta_sts.py rendered
      - run: uv run check_mta_sts.py deployed
      - run: uv run octodns-sync --config-file config.yaml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN_RO }}
      - run: jq -e '. == {}' plan.json

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run octodns-validate --config-file config.yaml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - run: uv run check_mta_sts.py rendered
      - run: uv run octodns-sync --config-file config.yaml --doit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
